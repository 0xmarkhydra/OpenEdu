  /v1/books:
    get:
      operationId: listPublishedBooks
      description: |
        Anonymous users see public published books only. A valid signed token permits
        listing published books for its school_id scope. Client-supplied tenant headers are ignored.
      parameters:
        - in: query
          name: grade
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: subject
          schema:
            type: string
            maxLength: 80
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Published and authorized books.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
