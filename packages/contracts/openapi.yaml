    get:
      operationId: listEditorialBooks
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Draft and published books visible to the editor}
        '401': {description: Authentication required}
        '403': {description: Editor role required}
    post:
      operationId: createBookDraft
      security:
        - bearerAuth: []
      description: Role platform_admin, content_admin, or school_admin. Draft only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Created draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role or wrong school visibility.
  /v1/admin/books/{id}/{action}:
    post:
      operationId: changeBookReviewStatus
      security:
        - bearerAuth: []
      description: |
        submit: draft -> review (author roles)
        approve: review -> approved (reviewers only)
        publish: approved -> published (publisher roles)
        archive: published -> archived (publisher roles).
        State mutation and audit are transactional.
      parameters:
        - $ref: '#/components/parameters/BookID'
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [submit, approve, publish, archive]
      responses:
        '200':
          description: Transition complete.
        '403':
          description: Insufficient permissions.
        '404':
          description: Book unavailable.
        '409':
          description: Invalid state transition.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid token.
  schemas:
    BookInput:
      type: object
      required: [title, grade, subject_code, rights_owner, rights_license, rights_source, visibility]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
        grade:
          type: integer
          minimum: 1
          maximum: 12
        subject_code:
          type: string
          maxLength: 500
        rights_owner:
          type: string
          maxLength: 500
        rights_license:
          type: string
          maxLength: 500
        rights_source:
          type: string
          maxLength: 500
        visibility:
          type: string
          enum: [public, school]
    Book:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            school_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [draft, review, approved, published, archived]
            published_at:
              type: string
              format: date-time
