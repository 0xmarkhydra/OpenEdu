openapi: 3.0.3
info:
  title: FreeEducation Core API
  version: 0.2.0
  description: |
    Initial public catalog and protected editorial endpoints.
    Auth issuer and login are separate planned capabilities.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: login
      description: Validate account password against database and return a 15-minute JWT scoped to one school or platform role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                school_id: {type: string, format: uuid}
      responses:
        '200': {description: Short-lived access token and verified role scope}
        '401': {description: Invalid credentials}
        '409': {description: School ID required for multi-school account}
        '429': {description: Temporarily blocked after repeated failures}
  /v1/auth/me:
    get:
      operationId: getCurrentIdentity
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active user, school and verified current roles}
        '401': {description: Invalid or revoked session}
  /v1/admin/schools:
    get:
      operationId: listSchools
      security: [{bearerAuth: []}]
      description: Requires a global platform_admin.
      responses:
        '200': {description: Authorized school list}
        '403': {description: Forbidden}
    post:
      operationId: createSchool
      security: [{bearerAuth: []}]
      description: Requires a global platform_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string, minLength: 2, maxLength: 160}
                slug: {type: string, minLength: 3, maxLength: 50}
      responses:
        '201': {description: Created tenant school}
        '409': {description: Duplicate slug}
  /v1/admin/schools/{id}/members:
    post:
      operationId: provisionSchoolMember
      security: [{bearerAuth: []}]
      description: Requires global platform_admin; no public minor signup.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, role]
              properties:
                email: {type: string, format: email}
                name: {type: string}
                password: {type: string, minLength: 12, maxLength: 72}
                role:
                  type: string
                  enum: [school_admin, principal, teacher, student, guardian, content_admin, content_reviewer]
      responses:
        '201': {description: Member added to selected school}
        '403': {description: Forbidden}
        '409': {description: Existing account must use an invitation flow}
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: API process is responsive.
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Database reachable.
        '503':
          description: Database unavailable.
  /v1/books:
    get:
      operationId: listPublishedBooks
      description: |
        Anonymous users see public published books only. A valid signed token permits
        listing published books for its school_id scope. Client-supplied tenant headers are ignored.
      parameters:
        - in: query
          name: grade
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: subject
          schema:
            type: string
            maxLength: 80
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Published and authorized books.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/books/{id}:
    get:
      operationId: getPublishedBook
      parameters:
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: Published and authorized book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Unknown or inaccessible book.
  /v1/admin/books:
    post:
      operationId: createBookDraft
      security:
        - bearerAuth: []
      description: Role platform_admin, content_admin, or school_admin. Draft only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Created draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Insufficient role or wrong school visibility.
  /v1/admin/books/{id}/{action}:
    post:
      operationId: changeBookReviewStatus
      security:
        - bearerAuth: []
      description: |
        submit: draft -> review (author roles)
        approve: review -> approved (reviewers only)
        publish: approved -> published (publisher roles)
        archive: published -> archived (publisher roles).
        State mutation and audit are transactional.
      parameters:
        - $ref: '#/components/parameters/BookID'
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [submit, approve, publish, archive]
      responses:
        '200':
          description: Transition complete.
        '403':
          description: Insufficient permissions.
        '404':
          description: Book unavailable.
        '409':
          description: Invalid state transition.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid token.
  schemas:
    BookInput:
      type: object
      required: [title, grade, subject_code, rights_owner, rights_license, rights_source, visibility]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
        grade:
          type: integer
          minimum: 1
          maximum: 12
        subject_code:
          type: string
          maxLength: 500
        rights_owner:
          type: string
          maxLength: 500
        rights_license:
          type: string
          maxLength: 500
        rights_source:
          type: string
          maxLength: 500
        visibility:
          type: string
          enum: [public, school]
    Book:
      allOf:
        - $ref: '#/components/schemas/BookInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            school_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [draft, review, approved, published, archived]
            published_at:
              type: string
              format: date-time
