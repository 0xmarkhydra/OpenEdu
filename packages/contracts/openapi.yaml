openapi: 3.0.3
info:
  title: OpenEdu Core API
  version: 0.4.0
  description: |
    Licensed library, tenant-isolated school operations, parent portal,
    assignments, attendance and editorial workflows. Source examples and
    access restrictions: docs/API_OPERATIONS.md.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: login
      description: Validate account password against database and return a 15-minute JWT scoped to one school or platform role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                school_id: {type: string, format: uuid}
      responses:
        '200': {description: Short-lived access token and verified role scope}
        '401': {description: Invalid credentials}
        '409': {description: School ID required for multi-school account}
        '429': {description: Temporarily blocked after repeated failures}
  /v1/auth/me:
    get:
      operationId: getCurrentIdentity
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Active user, school and verified current roles}
        '401': {description: Invalid or revoked session}
  /v1/admin/schools:
    get:
      operationId: listSchools
      security: [{bearerAuth: []}]
      description: Requires a global platform_admin.
      responses:
        '200': {description: Authorized school list}
        '403': {description: Forbidden}
    post:
      operationId: createSchool
      security: [{bearerAuth: []}]
      description: Requires a global platform_admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: {type: string, minLength: 2, maxLength: 160}
                slug: {type: string, minLength: 3, maxLength: 50}
      responses:
        '201': {description: Created tenant school}
        '409': {description: Duplicate slug}
  /v1/admin/schools/{id}/members:
    post:
      operationId: provisionSchoolMember
      security: [{bearerAuth: []}]
      description: Requires global platform_admin; no public minor signup.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, role]
              properties:
                email: {type: string, format: email}
                name: {type: string}
                password: {type: string, minLength: 12, maxLength: 72}
                role:
                  type: string
                  enum: [school_admin, principal, teacher, student, guardian, content_admin, content_reviewer]
      responses:
        '201': {description: Member added to selected school}
        '403': {description: Forbidden}
        '409': {description: Existing account must use an invitation flow}
  /v1/schools/{school}/years:
    parameters:
      - in: path
        name: school
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listAcademicYears
      description: Scoped OpenEdu operation; see docs/API_OPERATIONS.md for payloads, permissions and examples.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Successful operation or resource representation}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden or wrong school}
        '404': {description: Not found or unavailable resource}
    post:
